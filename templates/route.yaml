{{- if .Values.route.enabled }}
{{- $svcName := .Values.route.serviceName | default (include "app.fullname" .) }}
{{- $targetPort := .Values.route.targetPort | default .Values.service.name | default "http" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "app.fullname" . }}
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host | quote }}
  {{- end }}
  {{- if .Values.route.path }}
  path: {{ .Values.route.path | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ $svcName }}
    weight: {{ .Values.route.weight | default 100 }}
  port:
    targetPort: {{ $targetPort }}
  {{- if .Values.route.tls.enabled }}
  tls:
    termination: {{ .Values.route.tls.termination | default "edge" }}
    {{- if .Values.route.tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
    {{- end }}
    {{- with .Values.route.tls.certificate }}
    certificate: {{ . | quote }}
    {{- end }}
    {{- with .Values.route.tls.key }}
    key: {{ . | quote }}
    {{- end }}
    {{- with .Values.route.tls.caCertificate }}
    caCertificate: {{ . | quote }}
    {{- end }}
    {{- with .Values.route.tls.destinationCACertificate }}
    destinationCACertificate: {{ . | quote }}
    {{- end }}
  {{- end }}
  wildcardPolicy: {{ .Values.route.wildcardPolicy | default "None" }}
{{- end }}
